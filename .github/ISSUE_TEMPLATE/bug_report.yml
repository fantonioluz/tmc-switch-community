name: Relatar um bug
description: Conte o que aconteceu durante a partida.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Não anexe ROMs, saves pessoais ou credenciais."
  - type: input
    id: version
    attributes:
      label: Versão da edição
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Local e momento do jogo
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: "Explique também o resultado esperado e o que aconteceu."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Instalação e ROM
      description: "Região do dump, patches, instalação nova ou cache existente e modo de abertura. Não envie a ROM."
  - type: textarea
    id: evidence
    attributes:
      label: Fotos e informações adicionais
      description: "Se enviar um log, revise antes os dados pessoais."
